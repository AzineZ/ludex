# Replacement staging package after Render's static-site rewrite rejected POST.
# Create this as a new Blueprint; do not sync it into the old Blueprint.
services:
  - type: web
    name: ludex-staging-app
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerCommand: ./render-combined-start.sh
    plan: free
    region: oregon
    numInstances: 1
    healthCheckPath: /live
    autoDeployTrigger: "off"
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://ludex-staging-app.onrender.com
      - key: ACCESS_SESSION_COOKIE_SECURE
        value: "true"
      - key: DEPLOYMENT_ENVIRONMENT
        value: staging
      - key: STEAM_RATE_LIMIT_HMAC_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
