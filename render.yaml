# Provisional combined production Blueprint. Do not sync it until the
# Checkpoint 9 provisioning gate and dashboard price/hostname checks are
# approved.
services:
  - type: web
    name: ludex
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerCommand: ./render-combined-start.sh
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    healthCheckPath: /live
    autoDeployTrigger: "off"
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://ludex-h6k1.onrender.com
      - key: ACCESS_SESSION_COOKIE_SECURE
        value: "true"
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: STEAM_RATE_LIMIT_HMAC_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
