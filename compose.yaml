name: ludex

services:
   database:
      image: postgres:18-alpine
      environment:
         POSTGRES_DB: ludex
         POSTGRES_USER: ludex
         POSTGRES_PASSWORD: ludex
      ports:
         - "${LUDEX_DATABASE_PORT:-5432}:5432"
      volumes:
         - postgres_data:/var/lib/postgresql
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U ludex -d ludex"]
         interval: 5s
         timeout: 5s
         retries: 5

   backend:
      build:
         context: ./backend
      env_file:
         - ./backend/.env
      environment:
         DATABASE_URL: postgresql+psycopg://ludex:ludex@database:5432/ludex
         FRONTEND_ORIGIN: ${LUDEX_FRONTEND_ORIGIN:-http://localhost:5173}
         ACCESS_SESSION_COOKIE_SECURE: "false"
      ports:
         - "${LUDEX_BACKEND_PORT:-8000}:8000"
      depends_on:
         database:
            condition: service_healthy
      healthcheck:
         test:
            [
               "CMD",
               "python",
               "-c",
               "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
            ]
         interval: 5s
         timeout: 5s
         retries: 5
         start_period: 5s

   frontend:
      build:
         context: ./frontend
      environment:
         VITE_API_BASE_URL: ${LUDEX_API_BASE_URL:-http://localhost:8000}
      ports:
         - "${LUDEX_FRONTEND_PORT:-5173}:5173"
      depends_on:
         backend:
            condition: service_healthy

volumes:
   postgres_data:
