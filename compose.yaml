name: ludex

services:
   database:
      image: postgres:18-alpine
      environment:
         POSTGRES_DB: ludex
         POSTGRES_USER: ludex
         POSTGRES_PASSWORD: ludex
      ports:
         - "5432:5432"
      volumes:
         - postgres_data:/var/lib/postgresql
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U ludex -d ludex"]
         interval: 5s
         timeout: 5s
         retries: 5

volumes:
   postgres_data:
