# OBSOLETE: live verification proved that this static-site rewrite returns 404
# for session POST traffic. Do not create or manually sync this Blueprint.
# Keep it temporarily only to identify the two failed resources for cleanup.
services:
  - type: web
    name: ludex-staging-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: ./render-start.sh
    plan: free
    region: oregon
    numInstances: 1
    healthCheckPath: /live
    autoDeployTrigger: "off"
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://ludex-staging.onrender.com
      - key: ACCESS_SESSION_COOKIE_SECURE
        value: "true"
      - key: DEPLOYMENT_ENVIRONMENT
        value: staging
      - key: STEAM_RATE_LIMIT_HMAC_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false

  - type: web
    name: ludex-staging
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ludex-staging-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
